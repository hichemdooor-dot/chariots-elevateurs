<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css?v=7"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Préparation livraison</title></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Préparation livraison</h1><div class="sub">Préparer un chariot avant sa livraison</div></div></div><div class="card"><label class="label">Sélectionner un chariot</label><select id="prepSelect" class="search"><option value="">Choisir un chariot...</option></select><div id="prepInfo" class="card" style="margin-top:14px;display:none"></div><div class="form-actions" style="margin-top:14px"><button id="prepBtn" class="btn" type="button" disabled>Passer en préparation livraison</button><button id="viewBtn" class="btn light" type="button" disabled>Voir la fiche</button></div></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js"></script><script src="js/app.js"></script><script>
async function preparationLivraisonPage(){if(!await session())return;await loadChariots();const sel=document.getElementById('prepSelect'),info=document.getElementById('prepInfo'),prep=document.getElementById('prepBtn'),view=document.getElementById('viewBtn');const rows=[...CHARIOTS].filter(c=>normalizeStatus(c.status)!=='livré').sort((a,b)=>String(a.chassis||a.qr_id).localeCompare(String(b.chassis||b.qr_id),undefined,{numeric:true}));sel.innerHTML='<option value="">Choisir un chariot...</option>'+rows.map(c=>'<option value="'+esc(c.qr_id)+'">'+esc(c.chassis||c.qr_id)+' — '+esc(c.engine||'')+' — '+esc(fmtCapacity(c.capacity))+'</option>').join('');function render(){const c=CHARIOTS.find(x=>String(x.qr_id)===String(sel.value));if(!c){info.style.display='none';prep.disabled=true;view.disabled=true;return}info.style.display='block';info.innerHTML='<h2 style="margin-top:0">'+esc(c.chassis||c.qr_id)+'</h2><div class="details"><div class="kv"><small>Moteur</small><b>'+esc(c.engine||'—')+'</b></div><div class="kv"><small>Capacité</small><b>'+esc(fmtCapacity(c.capacity)||'—')+'</b></div><div class="kv"><small>Client</small><b>'+esc(c.client||'—')+'</b></div><div class="kv"><small>Statut</small><b>'+esc(c.status||'—')+'</b></div></div>';prep.disabled=false;view.disabled=false;view.onclick=()=>location.href='chariot.html?id='+encodeURIComponent(c.qr_id);prep.onclick=async()=>{if(!currentUser){alert('Connexion requise.');return}if(!confirm('Passer le chariot '+(c.chassis||c.qr_id)+' en « Préparation livraison » ?'))return;const now=new Date().toISOString();const {error}=await supabaseClient.from('chariots').update({status:'Préparation livraison',updated_at:now}).eq('qr_id',c.qr_id);if(error){alert('Erreur : '+error.message);return}try{await supabaseClient.from('maintenance').insert({qr_id:c.qr_id,date:now.slice(0,10),technicien:currentUser.email,type:'Statut',travaux:'Statut : '+(c.status||'—')+' → Préparation livraison',created_by:currentUser.id})}catch(e){}alert('Chariot passé en préparation livraison.');location.reload()}}sel.addEventListener('change',render);render()}
initPage(preparationLivraisonPage())
</script></body></html>
