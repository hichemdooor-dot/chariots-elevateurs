<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBI — Fiche de livraison</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#111;font-family:Arial,sans-serif}.toolbar{max-width:1100px;margin:12px auto;display:flex;justify-content:flex-end;gap:8px;padding:0 12px}.toolbar button,.toolbar a{border:0;border-radius:8px;padding:10px 14px;background:#15345b;color:white;text-decoration:none;font-weight:700;cursor:pointer}.toolbar a{background:#fff;color:#15345b;border:1px solid #cbd5df}.manual-panel{display:none;max-width:1100px;margin:12px auto;background:#fff;border:1px solid #d5dbe2;border-radius:12px;padding:16px}.manual-panel.open{display:block}.manual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.manual-grid label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#15345b}.manual-grid input,.manual-grid select{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;font:14px Arial}.manual-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.size-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #e1e6eb}.size-controls label{display:block;font-size:12px;font-weight:700;color:#15345b;margin-bottom:6px}.size-controls input{width:100%}.size-value{font-size:12px;color:#667085;font-weight:400}.manual-actions button{border:0;border-radius:7px;padding:10px 13px;background:#15345b;color:#fff;font-weight:700;cursor:pointer}.brand{height:23mm;flex:0 0 23mm;width:100%;background:#d71920;display:flex;align-items:center;justify-content:flex-start;padding:1.5mm 3mm;overflow:hidden}.brand .site-logo{display:block;width:auto;height:19mm;max-width:48mm;max-height:19mm;object-fit:contain;object-position:left center}
.sheet{width:297mm;height:210mm;min-height:210mm;margin:0 auto 20px;background:#fff;padding:3mm 5mm;box-shadow:0 2px 12px #0002;display:flex;flex-direction:column;justify-content:space-between;gap:1mm}.client{font-family:Georgia,'Times New Roman',serif;text-align:center;font-size:62pt;font-weight:700;line-height:1;margin:0;overflow-wrap:anywhere;flex:1 1 auto;display:flex;align-items:center;justify-content:center}.destination{font-family:Georgia,'Times New Roman',serif;text-align:center;color:#d71920;font-size:54pt;font-weight:700;line-height:1;margin:0 0 1mm;overflow-wrap:anywhere;flex:0 0 auto}.sold{background:#111;color:#fff;text-align:center;font-size:60pt;font-weight:900;letter-spacing:1px;padding:1.5mm 0;margin:0 0 1mm;flex:0 0 auto}.specs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #d5dbe2;margin-top:auto;flex:0 0 auto}.spec{min-width:0;text-align:center;position:relative;padding:1.5mm 1mm 2mm;background:#f6f7f9}.spec+.spec:before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:#d71920}.label{font-size:12pt;font-weight:800;margin-bottom:1mm}.value{font-size:24pt;font-weight:900;color:#d71920;overflow-wrap:anywhere}.footer{display:none}.error{font-weight:700;color:#a11;text-align:center;margin:30px}
@page{size:A4 landscape;margin:0} @media print{html,body{width:297mm;height:210mm;margin:0!important;padding:0!important;background:white!important;overflow:hidden}.toolbar,.manual-panel{display:none!important}body>*:not(#sheet){display:none!important}#sheet{display:flex!important;position:absolute;left:0;top:0;margin:0!important;width:297mm!important;height:210mm!important;min-height:210mm!important;max-height:210mm!important;box-shadow:none!important;padding:3mm 5mm!important;page-break-after:avoid!important;break-after:avoid!important;overflow:hidden}.client,.destination,.sold{flex-shrink:0}.client{font-size:var(--print-client-size,62pt)}.destination{font-size:var(--print-destination-size,54pt)}.sold{font-size:var(--print-status-size,60pt)}.specs{margin-top:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.brand,.sold,.spec,.value{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media screen and (max-width:850px){.manual-grid,.size-controls{grid-template-columns:1fr}.sheet{width:100%;height:auto;min-height:600px;padding:14px}.brand{height:auto;min-height:54px;flex-basis:auto;padding:8px}.brand .site-logo{height:42px;max-height:42px;max-width:65%}.client{font-size:clamp(32px,8vw,58px);margin:12px 0}.destination{font-size:clamp(30px,7vw,48px)}.sold{font-size:clamp(34px,8vw,52px);padding:10px}.label{font-size:10px}.value{font-size:clamp(13px,3vw,23px)}}
</style>
</head>
<body>
<div class="toolbar"><a href="chariots-prevus-livraison.html">← Retour</a><button type="button" id="manualToggle">Saisie manuelle</button><button type="button" onclick="window.print()">Imprimer / Enregistrer PDF</button></div><section id="manualPanel" class="manual-panel"><h2 style="margin:0 0 12px;color:#15345b">Créer une fiche manuellement</h2><div class="manual-grid"><div><label for="mClient">Nom du client</label><input id="mClient" placeholder="Nom du client" style="text-transform:uppercase"></div><div><label for="mDestination">Destination</label><select id="mDestination"><option value="">Choisir une wilaya…</option><option>Adrar</option><option>Alger</option><option>Annaba</option><option>Batna</option><option>Béchar</option><option>Béjaïa</option><option>Biskra</option><option>Blida</option><option>Bordj Bou Arréridj</option><option>Bouira</option><option>Boumerdès</option><option>Chlef</option><option>Constantine</option><option>Djelfa</option><option>El Bayadh</option><option>El Oued</option><option>El Tarf</option><option>Ghardaïa</option><option>Guelma</option><option>Illizi</option><option>Jijel</option><option>Khenchela</option><option>Laghouat</option><option>Mostaganem</option><option>M’Sila</option><option>Mascara</option><option>Médéa</option><option>Mila</option><option>Naâma</option><option>Oran</option><option>Ouargla</option><option>Oum El Bouaghi</option><option>Relizane</option><option>Saïda</option><option>Sétif</option><option>Sidi Bel Abbès</option><option>Skikda</option><option>Souk Ahras</option><option>Tamanrasset</option><option>Tébessa</option><option>Tiaret</option><option>Tindouf</option><option>Tissemsilt</option><option>Tizi Ouzou</option><option>Tlemcen</option><option>Tipaza</option><option>Autre…</option></select><input id="mDestinationCustom" placeholder="Saisir la destination" style="text-transform:uppercase" hidden></div><div><label for="mCapacity">Capacité</label><select id="mCapacity"><option value="">Choisir une capacité…</option><option>2.5T</option><option>3T</option><option>3.5T</option><option>3.8T</option><option>5T</option><option>7T</option><option>10T</option><option>12T</option><option>Autre…</option></select><input id="mCapacityCustom" placeholder="Saisir la capacité" hidden></div><div><label for="mEngine">Type de moteur</label><select id="mEngine"><option value="">Choisir un moteur…</option><option>ISUZU</option><option>MITSUBISHI</option><option>XINCHAI</option><option>YANMAR</option><option>GPL</option></select></div><div><label for="mMast">Type de mât</label><select id="mMast"><option value="">Choisir un type de mât…</option><option>DUPLEX</option><option>TRIPLEX</option><option>Autre…</option></select><input id="mMastCustom" placeholder="Saisir le type de mât" hidden><select id="mHeight"><option value="">Hauteur de levage…</option><option>3M</option><option>4M</option><option>4.3M</option><option>4.5M</option><option>6M</option></select><div style="grid-column:1/-1"><label for="mOptions">Options supplémentaires (facultatif)</label><textarea id="mOptions" rows="2" placeholder="Ex. : déplacement latéral, fourches spéciales, cabine, pneus pleins…" style="width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;font:14px Arial;resize:vertical"></textarea></div></div><div class="size-controls"><div><label for="sizeClient">Taille du nom <span id="sizeClientValue" class="size-value">62 pt</span></label><input id="sizeClient" type="range" min="24" max="100" value="62"></div><div><label for="sizeDestination">Taille de la destination <span id="sizeDestinationValue" class="size-value">54 pt</span></label><input id="sizeDestination" type="range" min="22" max="90" value="54"></div></div><div class="manual-actions"><button type="button" id="applyManual">Afficher sur la fiche</button><button type="button" id="clearManual">Effacer les champs</button></div></section>
<main id="sheet" class="sheet" aria-label="Fiche de livraison">
  <header class="brand"><img class="site-logo" src="assets/sbi-benouatas-logo.webp?v=20261015f" alt="SBI BENOUATAS INDUSTRIE · ALGÉRIE"></header>
  
  <div id="client" class="client">Chargement…</div>
  <div id="destination" class="destination"></div>
  <div id="sold" class="sold">VENDU</div>
  <section id="extraOptions" style="display:none;white-space:pre-wrap;text-align:center;font-family:Arial,sans-serif;font-size:18pt;font-weight:700;color:#15345b;border:1px solid #d5dbe2;padding:2mm 3mm;overflow-wrap:anywhere"><div style="font-size:10pt;color:#d71920;margin-bottom:1mm">OPTIONS SUPPLÉMENTAIRES</div><div id="extraOptionsText"></div></section>
  <section class="specs">
    <div class="spec"><div class="label">CAPACITÉ</div><div id="capacity" class="value">—</div></div>
    <div class="spec"><div class="label">MOTEUR</div><div id="engine" class="value">—</div></div>
    <div class="spec"><div class="label">TYPE DE MÂT</div><div id="mast" class="value">—</div></div>
  </section>
  </main>
<script src="js/shell.js?v=20261018a"></script><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=20261018menu2"></script>
<script>
function ficheText(value,fallback='—'){return String(value??'').trim()||fallback}
async function loadDeliveryFiche(){
 try{
  const params=new URLSearchParams(location.search), qr=params.get('qr')||'';
  if(!qr){
   document.getElementById('manualPanel').classList.add('open');
   document.getElementById('client').textContent='NOM DU CLIENT';
   document.getElementById('destination').textContent='DESTINATION';
   
   document.getElementById('capacity').textContent='—';
   document.getElementById('engine').textContent='—';
   document.getElementById('mast').textContent='—';
   fitFicheText();
   return;
  }
  if(!await session())return;
  await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:false})}catch(e){console.warn('Planification non disponible',e)}
  const c=CHARIOTS.find(x=>String(x.qr_id)===String(qr));
  if(!c){document.getElementById('sheet').innerHTML='<div class="error">Chariot introuvable. Retournez à la liste et ouvrez la fiche depuis le bon chariot.</div>';return}
  const plan=typeof getDeliveryPlan==='function'?getDeliveryPlan(c.qr_id):null;
  document.getElementById('client').textContent=ficheText(c.client,'CLIENT À RENSEIGNER').toLocaleUpperCase('fr');
  document.getElementById('destination').textContent=ficheText(plan?.destination||c.destination||c.delivery_destination,'DESTINATION À RENSEIGNER').toLocaleUpperCase('fr');
  document.getElementById('capacity').textContent=ficheText(fmtCapacity(c.capacity)||c.capacity);
  document.getElementById('engine').textContent=ficheText(c.engine);
  document.getElementById('mast').textContent=ficheText((c.mast_type||'')+(c.lifting_height?' '+c.lifting_height+' M':''));
  document.title='Fiche livraison — '+ficheText(c.client,'SBI');
 }catch(e){console.error(e);document.getElementById('sheet').innerHTML='<div class="error">Impossible de charger les données du chariot. Réessayez depuis le site SBI.</div>'}
}
function fitFicheText(){const settings=[['client','sizeClient',62,24,'sizeClientValue','--print-client-size'],['destination','sizeDestination',54,22,'sizeDestinationValue','--print-destination-size']];settings.forEach(([id,inputId,def,min,labelId,cssVar])=>{const el=document.getElementById(id),input=document.getElementById(inputId);if(!el)return;let size=input?Number(input.value):def;document.documentElement.style.setProperty(cssVar,size+'pt');if(labelId&&document.getElementById(labelId))document.getElementById(labelId).textContent=size+' pt';el.style.fontSize=size+'pt';while(el.scrollWidth>el.clientWidth+1&&size>min){size--;el.style.fontSize=size+'pt';}});}
function selectedOrCustom(id){const el=document.getElementById(id);if(!el)return '';if(el.value==='Autre…')return (document.getElementById(id+'Custom')?.value||'').trim();return el.value.trim();}function applyManualFiche(){const client=document.getElementById('mClient').value.trim();const destination=selectedOrCustom('mDestination');const capacity=selectedOrCustom('mCapacity');const engine=selectedOrCustom('mEngine');const mastType=selectedOrCustom('mMast');const height=document.getElementById('mHeight').value.trim();const mast=[mastType,height].filter(Boolean).join(' ');const extraOptions=document.getElementById('mOptions').value.trim();document.getElementById('extraOptionsText').textContent=extraOptions;document.getElementById('extraOptions').style.display=extraOptions?'block':'none';document.getElementById('client').textContent=(client||'CLIENT').toLocaleUpperCase('fr');document.getElementById('destination').textContent=(destination||'DESTINATION').toLocaleUpperCase('fr');document.getElementById('capacity').textContent=capacity||'—';document.getElementById('engine').textContent=engine||'—';document.getElementById('mast').textContent=mast||'—';document.title='Fiche livraison — '+(client||'SBI');fitFicheText();}
document.getElementById('manualToggle').addEventListener('click',()=>document.getElementById('manualPanel').classList.toggle('open'));['sizeClient','sizeDestination'].forEach(id=>document.getElementById(id).addEventListener('input',fitFicheText));document.getElementById('applyManual').addEventListener('click',applyManualFiche);['mDestination','mCapacity','mMast'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',()=>{const custom=document.getElementById(id+'Custom');if(custom){custom.hidden=el.value!=='Autre…';if(!custom.hidden)custom.focus();}if(id==='mMast'){const height=document.getElementById('mHeight');if(height)height.hidden=false;}})});document.getElementById('clearManual').addEventListener('click',()=>{['mClient','mDestination','mDestinationCustom','mCapacity','mCapacityCustom','mEngine','mMast','mMastCustom','mHeight','mOptions'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';if(id.endsWith('Custom'))el.hidden=true;}});});window.addEventListener('resize',fitFicheText);window.addEventListener('beforeprint',fitFicheText);initPage(loadDeliveryFiche());
</script>
</body></html>
