<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBI — Fiche de livraison</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#111;font-family:Arial,sans-serif}.toolbar{max-width:1100px;margin:12px auto;display:flex;justify-content:flex-end;gap:8px;padding:0 12px}.toolbar button,.toolbar a{border:0;border-radius:8px;padding:10px 14px;background:#15345b;color:white;text-decoration:none;font-weight:700;cursor:pointer}.toolbar a{background:#fff;color:#15345b;border:1px solid #cbd5df}.manual-panel{display:none;max-width:1100px;margin:12px auto;background:#fff;border:1px solid #d5dbe2;border-radius:12px;padding:16px}.manual-panel.open{display:block}.manual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.manual-grid label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#15345b}.manual-grid input,.manual-grid select{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;font:14px Arial}.manual-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.manual-actions button{border:0;border-radius:7px;padding:10px 13px;background:#15345b;color:#fff;font-weight:700;cursor:pointer}.sheet{width:297mm;height:210mm;min-height:210mm;margin:0 auto 20px;background:#fff;padding:5mm 7mm;box-shadow:0 2px 12px #0002;display:flex;flex-direction:column;justify-content:space-between}.brand{height:21mm;flex:0 0 21mm;background:#d71920;color:white;display:grid;grid-template-columns:25% 50% 25%;align-items:center;padding:2mm 4mm;gap:4mm}.brand img{max-width:100%;max-height:18mm;object-fit:contain}.brand .sbi{justify-self:start;width:47mm}.brand .hangcha{justify-self:end;width:43mm}.company{text-align:center;font-weight:800;font-size:15pt;line-height:1.25}.company small{display:block;font-size:10pt;margin-top:2mm}.client{font-family:Georgia,'Times New Roman',serif;text-align:center;font-size:50pt;font-weight:700;line-height:1;margin:2mm 0 0;overflow-wrap:anywhere;flex:1 1 auto;display:flex;align-items:center;justify-content:center}.destination{font-family:Georgia,'Times New Roman',serif;text-align:center;color:#d71920;font-size:43pt;font-weight:700;line-height:1;margin:0 0 2mm;overflow-wrap:anywhere;flex:0 0 auto}.sold{background:#111;color:#fff;text-align:center;font-size:46pt;font-weight:900;letter-spacing:1px;padding:2mm 0;margin:0 0 2mm;flex:0 0 auto}.specs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #d5dbe2;margin-top:auto;flex:0 0 auto}.spec{min-width:0;text-align:center;position:relative;padding:2mm 1mm 3mm;background:#f6f7f9}.spec+.spec:before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:#d71920}.label{font-size:10pt;font-weight:800;margin-bottom:1.5mm}.value{font-size:19pt;font-weight:900;color:#d71920;overflow-wrap:anywhere}.footer{display:none}.error{font-weight:700;color:#a11;text-align:center;margin:30px}
@page{size:A4 landscape;margin:0} @media print{body{background:white}.toolbar{display:none}.sheet{margin:0;width:297mm;height:210mm;min-height:210mm;box-shadow:none;padding:8mm 9mm;page-break-after:avoid}.client{font-size:37pt}.destination{font-size:32pt}.sold{font-size:31pt}.specs{margin-top:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.brand,.sold,.spec,.value{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media screen and (max-width:850px){.manual-grid{grid-template-columns:1fr}.sheet{width:100%;height:auto;min-height:600px;padding:14px}.brand{height:auto;min-height:76px;grid-template-columns:24% 52% 24%;gap:5px;padding:8px}.brand .sbi,.brand .hangcha{width:100%;max-height:54px}.company{font-size:12px}.company small{font-size:10px}.client{font-size:clamp(32px,8vw,58px);margin:12px 0}.destination{font-size:clamp(30px,7vw,48px)}.sold{font-size:clamp(34px,8vw,52px);padding:10px}.label{font-size:10px}.value{font-size:clamp(13px,3vw,23px)}}
</style>
</head>
<body>
<div class="toolbar"><a href="chariots-prevus-livraison.html">← Retour</a><button type="button" id="manualToggle">Saisie manuelle</button><button type="button" onclick="window.print()">Imprimer / Enregistrer PDF</button></div><section id="manualPanel" class="manual-panel"><h2 style="margin:0 0 12px;color:#15345b">Créer une fiche manuellement</h2><div class="manual-grid"><div><label for="mClient">Nom du client</label><input id="mClient" placeholder="Nom du client"></div><div><label for="mDestination">Destination</label><input id="mDestination" placeholder="Ville / Wilaya"></div><div><label for="mStatus">Statut</label><select id="mStatus"><option>VENDU</option><option>RÉSERVÉ</option><option>EN STOCK</option></select></div><div><label for="mCapacity">Capacité</label><input id="mCapacity" placeholder="3T"></div><div><label for="mEngine">Moteur</label><input id="mEngine" placeholder="XINCHAI"></div><div><label for="mMast">Type de mât</label><input id="mMast" placeholder="TRIPLEX 4.5 M"></div></div><div class="manual-actions"><button type="button" id="applyManual">Afficher sur la fiche</button><button type="button" id="clearManual">Effacer les champs</button></div></section>
<main id="sheet" class="sheet" aria-label="Fiche de livraison">
  <header class="brand">
    <img class="sbi" src="assets/sbi-benouatas-logo.webp" alt="SBI">
    <div class="company">SARL BENOUATAS INDUSTRIE<small>ALGÉRIE</small></div>
    <img class="hangcha" src="assets/logo-sbi-hangcha.png" alt="HANGCHA">
  </header>
  <div id="client" class="client">Chargement…</div>
  <div id="destination" class="destination"></div>
  <div id="sold" class="sold">VENDU</div>
  <section class="specs">
    <div class="spec"><div class="label">CAPACITÉ</div><div id="capacity" class="value">—</div></div>
    <div class="spec"><div class="label">MOTEUR</div><div id="engine" class="value">—</div></div>
    <div class="spec"><div class="label">TYPE DE MÂT</div><div id="mast" class="value">—</div></div>
  </section>
  </main>
<script src="js/shell.js?v=20261018a"></script><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=20261018menu2"></script>
<script>
function ficheText(value,fallback='—'){return String(value??'').trim()||fallback}
async function loadDeliveryFiche(){
 try{
  const params=new URLSearchParams(location.search), qr=params.get('qr')||'';
  if(!qr){
   document.getElementById('manualPanel').classList.add('open');
   document.getElementById('client').textContent='NOM DU CLIENT';
   document.getElementById('destination').textContent='DESTINATION';
   document.getElementById('sold').textContent='VENDU';
   document.getElementById('capacity').textContent='—';
   document.getElementById('engine').textContent='—';
   document.getElementById('mast').textContent='—';
   fitFicheText();
   return;
  }
  if(!await session())return;
  await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:false})}catch(e){console.warn('Planification non disponible',e)}
  const c=CHARIOTS.find(x=>String(x.qr_id)===String(qr));
  if(!c){document.getElementById('sheet').innerHTML='<div class="error">Chariot introuvable. Retournez à la liste et ouvrez la fiche depuis le bon chariot.</div>';return}
  const plan=typeof getDeliveryPlan==='function'?getDeliveryPlan(c.qr_id):null;
  document.getElementById('client').textContent=ficheText(c.client,'CLIENT À RENSEIGNER');
  document.getElementById('destination').textContent=ficheText(plan?.destination||c.destination||c.delivery_destination,'DESTINATION À RENSEIGNER');
  document.getElementById('capacity').textContent=ficheText(fmtCapacity(c.capacity)||c.capacity);
  document.getElementById('engine').textContent=ficheText(c.engine);
  document.getElementById('mast').textContent=ficheText((c.mast_type||'')+(c.lifting_height?' '+c.lifting_height+' M':''));
  document.title='Fiche livraison — '+ficheText(c.client,'SBI');
 }catch(e){console.error(e);document.getElementById('sheet').innerHTML='<div class="error">Impossible de charger les données du chariot. Réessayez depuis le site SBI.</div>'}
}
function fitFicheText(){[['client',50,24],['destination',43,22],['sold',46,26]].forEach(([id,max,min])=>{const el=document.getElementById(id);if(!el)return;el.style.fontSize=max+'pt';while(el.scrollWidth>el.clientWidth+1&&parseFloat(el.style.fontSize)>min)el.style.fontSize=(parseFloat(el.style.fontSize)-1)+'pt';});}
function applyManualFiche(){const client=document.getElementById('mClient').value.trim();const destination=document.getElementById('mDestination').value.trim();const status=document.getElementById('mStatus').value.trim();const capacity=document.getElementById('mCapacity').value.trim();const engine=document.getElementById('mEngine').value.trim();const mast=document.getElementById('mMast').value.trim();document.getElementById('client').textContent=client||'CLIENT';document.getElementById('destination').textContent=destination||'DESTINATION';document.getElementById('sold').textContent=status||'VENDU';document.getElementById('capacity').textContent=capacity||'—';document.getElementById('engine').textContent=engine||'—';document.getElementById('mast').textContent=mast||'—';document.title='Fiche livraison — '+(client||'SBI');fitFicheText();}
document.getElementById('manualToggle').addEventListener('click',()=>document.getElementById('manualPanel').classList.toggle('open'));document.getElementById('applyManual').addEventListener('click',applyManualFiche);document.getElementById('clearManual').addEventListener('click',()=>{['mClient','mDestination','mCapacity','mEngine','mMast'].forEach(id=>document.getElementById(id).value='');document.getElementById('mStatus').value='VENDU'});window.addEventListener('resize',fitFicheText);window.addEventListener('beforeprint',fitFicheText);initPage(loadDeliveryFiche());
</script>
</body></html>
