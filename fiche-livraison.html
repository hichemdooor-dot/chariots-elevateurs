*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#111;font-family:Arial,sans-serif}.toolbar{max-width:1100px;margin:12px auto;display:flex;justify-content:flex-end;gap:8px;padding:0 12px}.toolbar button,.toolbar a{border:0;border-radius:8px;padding:10px 14px;background:#15345b;color:white;text-decoration:none;font-weight:700;cursor:pointer}.toolbar a{background:#fff;color:#15345b;border:1px solid #cbd5df}.manual-panel{display:none;max-width:1100px;margin:12px auto;background:#fff;border:1px solid #d5dbe2;border-radius:12px;padding:16px}.manual-panel.open{display:block}.manual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.manual-grid label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#15345b}.manual-grid input,.manual-grid select{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;font:14px Arial}.manual-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.size-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #e1e6eb}.size-controls label{display:block;font-size:12px;font-weight:700;color:#15345b;margin-bottom:6px}.size-controls input{width:100%}.size-value{font-size:12px;color:#667085;font-weight:400}.manual-actions button{border:0;border-radius:7px;padding:10px 13px;background:#15345b;color:#fff;font-weight:700;cursor:pointer}.brand{height:25mm;flex:0 0 25mm;width:calc(100% + 10mm);min-width:0;margin-left:-5mm;margin-right:-5mm;background:#fff;display:flex;align-items:center;justify-content:center;padding:1mm 2mm 2mm;border-bottom:1mm solid #d71920;overflow:hidden;line-height:normal}.brand .brand-banner{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:22mm!important;min-width:0!important;object-fit:contain!important;object-position:center center!important;margin:0 auto;transform:scale(2);transform-origin:center center}
.sheet{width:297mm;height:210mm;min-height:210mm;margin:0 auto 20px;background:#fff;padding:3mm 5mm;box-shadow:0 2px 12px #0002;display:flex;flex-direction:column;justify-content:space-between;gap:1mm}.client{font-family:Georgia,'Times New Roman',serif;text-align:center;font-size:62pt;font-weight:700;line-height:1;margin:0;overflow-wrap:anywhere;flex:1 1 auto;display:flex;align-items:center;justify-content:center}.client-logo{display:block;width:var(--client-logo-size,90%);height:var(--client-logo-size,90%);max-width:100%;max-height:100%;object-fit:contain;margin:auto}.client.logo-mode{overflow:hidden}.destination{font-family:Georgia,'Times New Roman',serif;text-align:center;color:#d71920;font-size:54pt;font-weight:700;line-height:1;margin:0 0 1mm;overflow-wrap:anywhere;flex:0 0 auto}.sold{background:#fff;color:#111;text-align:center;font-size:60pt;font-weight:900;letter-spacing:1px;padding:1.5mm 0;margin:0 0 1mm;flex:0 0 auto}.specs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #d5dbe2;margin-top:auto;flex:0 0 auto}.spec{min-width:0;text-align:center;position:relative;padding:1.5mm 1mm 2mm;background:#f6f7f9}.spec+.spec:before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:#d71920}.label{font-size:12pt;font-weight:800;margin-bottom:1mm}.value{font-size:24pt;font-weight:900;color:#d71920;overflow-wrap:anywhere}.footer{display:none}.error{font-weight:700;color:#a11;text-align:center;margin:30px}
@page{size:A4 landscape;margin:0} @media print{html,body{width:297mm!important;height:210mm!important;min-height:0!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}body{position:relative!important}.toolbar,.manual-panel{display:none!important}body>*:not(#sheet){display:none!important}#sheet{display:flex!important;position:fixed!important;left:0!important;top:0!important;margin:0!important;width:297mm!important;height:210mm!important;min-height:0!important;max-height:210mm!important;box-sizing:border-box!important;box-shadow:none!important;padding:3mm 5mm!important;page-break-before:avoid!important;page-break-after:avoid!important;break-before:avoid-page!important;break-after:avoid-page!important;overflow:hidden!important;contain:layout paint!important}.brand,.client,.destination,.sold,.specs,#extraOptions{min-height:0!important;break-inside:avoid!important;page-break-inside:avoid!important}.brand{flex-shrink:0!important}.client{font-size:var(--print-client-size,62pt);min-width:0!important;flex-shrink:1!important}.destination{font-size:var(--print-destination-size,54pt);flex-shrink:1!important}.sold{font-size:var(--print-status-size,60pt);flex-shrink:1!important}.specs{margin-top:auto;flex-shrink:0!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.spec,.value,.brand,.sold{-webkit-print-color-adjust:exact;print-color-adjust:exact}#extraOptions{max-height:24mm!important;overflow:hidden!important;font-size:12pt!important}}
@media screen and (max-width:850px){.manual-grid,.size-controls{grid-template-columns:1fr}.sheet{width:100%;height:auto;min-height:600px;padding:14px}.brand{width:calc(100% + 28px);margin-left:-14px;margin-right:-14px;height:100px;min-height:100px;flex:0 0 100px;min-width:0;padding:4px 0 7px;border-bottom-width:3px}.brand .brand-banner{width:100%!important;height:100%!important;max-width:100%!important;max-height:88px!important;min-width:0!important;object-fit:contain!important;object-position:center center!important}.client{font-size:clamp(32px,8vw,58px);margin:12px 0}.destination{font-size:clamp(30px,7vw,48px)}.sold{font-size:clamp(34px,8vw,52px);padding:10px}.label{font-size:10px}.value{font-size:clamp(13px,3vw,23px)}}
/* Mobile-first controls for the manual delivery sheet */
.live-preview{display:none}
@media screen and (max-width:600px){
 .live-preview{display:block;position:sticky;top:6px;z-index:5;margin:12px 0 18px;padding:10px 12px;background:#f8fafc;border:1px solid #cbd5df;border-radius:12px;box-shadow:0 3px 12px #15345b18;overflow:hidden}
 .live-preview-title{font:700 11px Arial,sans-serif;letter-spacing:.08em;color:#667085;text-align:left;margin-bottom:6px}
 .preview-client{font-family:Georgia,'Times New Roman',serif;font-weight:700;line-height:1.05;text-align:center;font-size:clamp(20px,5vw,32px);overflow-wrap:anywhere;max-height:2.1em;overflow:hidden}
 .preview-destination{font-family:Georgia,'Times New Roman',serif;font-weight:700;line-height:1.05;text-align:center;color:#d71920;font-size:clamp(17px,4vw,26px);overflow-wrap:anywhere;max-height:2.1em;overflow:hidden;margin:3px 0 6px}

@media screen and (max-width:600px){
 body{font-size:16px}
 .toolbar{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1fr);gap:8px;margin:10px 0;padding:0 12px}
 .toolbar a,.toolbar button{display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;min-height:54px;padding:10px 9px;border-radius:12px;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
 .toolbar button:last-child{grid-column:1/-1;min-height:48px}
 .manual-panel{margin:10px 8px 14px;padding:16px 14px;border-radius:14px}
 .manual-panel h2{font-size:clamp(22px,6vw,28px)!important;line-height:1.15!important;margin-bottom:16px!important}
 .manual-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
 .manual-grid>div{min-width:0}
 .manual-grid label,.size-controls label{font-size:14px;line-height:1.3;margin-bottom:7px}
 .manual-grid input,.manual-grid select,.manual-grid textarea{width:100%;min-width:0;min-height:48px;padding:12px;font-size:16px!important;border-radius:10px}
 .manual-grid textarea{min-height:82px;resize:vertical}
 .size-controls{grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px;padding-top:16px}
 .size-controls input[type=range]{display:block;width:100%;min-height:32px;margin:8px 0 0;accent-color:#15345b}
 .size-value{font-size:14px;white-space:nowrap}
 .manual-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:18px}
 .manual-actions button{width:100%;min-height:48px;font-size:15px;border-radius:10px}
 .sheet{margin:0 8px 16px;width:calc(100% - 16px);min-height:520px;padding:12px;gap:8px;border-radius:12px}
 .brand{width:calc(100% + 24px);margin-left:-12px;margin-right:-12px;height:76px;min-height:76px;flex-basis:76px;padding:4px 0 6px}
 .brand .brand-banner{max-height:66px!important}
 .client{font-size:clamp(28px,8vw,48px);line-height:1.05;margin:8px 0;overflow-wrap:anywhere}
 .destination{font-size:clamp(25px,7vw,40px);line-height:1.08;margin-bottom:4px}
 .sold{font-size:clamp(30px,8vw,44px);line-height:1.1;padding:10px 6px;margin-bottom:4px}
 .specs{grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
 .spec{padding:10px 4px;overflow-wrap:anywhere}
 .label{font-size:clamp(9px,2.7vw,12px);line-height:1.2}
 .value{font-size:clamp(12px,3.4vw,18px);line-height:1.2}
 #extraOptions{font-size:14px!important;padding:10px!important}
}
@media screen and (max-width:360px){
 .toolbar{grid-template-columns:1fr 1fr}
 .toolbar a,.toolbar button{font-size:14px}

 .value{font-size:12px}
}

<div class="toolbar"><a href="chariots-prevus-livraison.html">← Retour</a><button type="button" id="manualToggle">Saisie manuelle</button><button type="button" onclick="window.print()">Imprimer / Enregistrer PDF</button></div><section id="manualPanel" class="manual-panel"><h2 style="margin:0 0 12px;color:#15345b">Créer une fiche manuellement</h2><div class="manual-grid"><div><label for="mClient">Nom du client</label><input id="mClient" placeholder="Nom du client" style="text-transform:uppercase"></div><div><label for="mClientLogo">Logo du client (facultatif)</label><input id="mClientLogo" type="file" accept="image/*" style="width:100%;padding:8px;border:1px solid #cbd5df;border-radius:7px;background:#fff"><button type="button" id="removeClientLogo" style="margin-top:6px;border:0;border-radius:7px;padding:8px 10px;background:#eef2f6;color:#15345b;font-weight:700;cursor:pointer">Supprimer le logo enregistré</button><small style="display:block;margin-top:5px;color:#667085">Le logo est mémorisé dans ce navigateur pour ce client.</small></div><div><label for="mDestination">Destination</label><select id="mDestination"><option value="">Choisir une wilaya…</option><option>Adrar</option><option>Alger</option><option>Annaba</option><option>Batna</option><option>Béchar</option><option>Béjaïa</option><option>Biskra</option><option>Blida</option><option>Bordj Bou Arréridj</option><option>Bouira</option><option>Boumerdès</option><option>Chlef</option><option>Constantine</option><option>Djelfa</option><option>El Bayadh</option><option>El Oued</option><option>El Tarf</option><option>Ghardaïa</option><option>Guelma</option><option>Illizi</option><option>Jijel</option><option>Khenchela</option><option>Laghouat</option><option>Mostaganem</option><option>M’Sila</option><option>Mascara</option><option>Médéa</option><option>Mila</option><option>Naâma</option><option>Oran</option><option>Ouargla</option><option>Oum El Bouaghi</option><option>Relizane</option><option>Saïda</option><option>Sétif</option><option>Sidi Bel Abbès</option><option>Skikda</option><option>Souk Ahras</option><option>Tamanrasset</option><option>Tébessa</option><option>Tiaret</option><option>Tindouf</option><option>Tissemsilt</option><option>Tizi Ouzou</option><option>Tlemcen</option><option>Tipaza</option><option>Autre…</option></select><input id="mDestinationCustom" placeholder="Saisir la destination" style="text-transform:uppercase" hidden></div><div><label for="mCapacity">Capacité</label><select id="mCapacity"><option value="">Choisir une capacité…</option><option>1.8T</option><option>2.5T</option><option>3T</option><option>3.5T</option><option>3.8T</option><option>5T</option><option>7T</option><option>10T</option><option>12T</option><option>Autre…</option></select><input id="mCapacityCustom" placeholder="Saisir la capacité" hidden></div><div><label for="mEngine">Type de moteur</label><select id="mEngine"><option value="">Choisir un moteur…</option><option>ÉLECTRIQUE</option><option>ISUZU</option><option>MITSUBISHI</option><option>XINCHAI</option><option>YANMAR</option><option>GPL</option></select></div><div><label for="mMast">Type de mât</label><select id="mMast"><option value="">Choisir un type de mât…</option><option>DUPLEX</option><option>TRIPLEX</option><option>Autre…</option></select><input id="mMastCustom" placeholder="Saisir le type de mât" hidden><select id="mHeight"><option value="">Hauteur de levage…</option><option>3M</option><option>4M</option><option>4.3M</option><option>4.5M</option><option>6M</option></select><div style="grid-column:1/-1"><label for="mOptions">Options supplémentaires (facultatif)</label><textarea id="mOptions" rows="2" placeholder="Ex. : déplacement latéral, fourches spéciales, cabine, pneus pleins…" style="width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;font:14px Arial;resize:vertical"></textarea></div></div><div id="livePreview" class="live-preview" aria-label="Aperçu en direct"><div class="live-preview-title">APERÇU EN DIRECT</div><div id="previewClient" class="preview-client">NOM DU CLIENT</div><div id="previewDestination" class="preview-destination">DESTINATION</div><div id="previewSold" class="preview-sold">VENDU</div><div class="live-preview-note">L’aperçu se met à jour pendant le réglage des tailles.</div></div><div class="size-controls"><div><label for="sizeClient">Taille du nom <span id="sizeClientValue" class="size-value">62 pt</span></label><input id="sizeClient" type="range" min="24" max="100" value="62"></div><div><label for="sizeDestination">Taille de la destination <span id="sizeDestinationValue" class="size-value">54 pt</span></label><input id="sizeDestination" type="range" min="22" max="90" value="54"></div><div><label for="sizeStatus">Taille de VENDU <span id="sizeStatusValue" class="size-value">60 pt</span></label><input id="sizeStatus" type="range" min="26" max="100" value="60"></div><div><label for="sizeClientLogo">Taille du logo client <span id="sizeClientLogoValue" class="size-value">90 %</span></label><input id="sizeClientLogo" type="range" min="30" max="100" value="90"></div></div><div class="manual-actions"><button type="button" id="applyManual">Afficher sur la fiche</button><button type="button" id="clearManual">Effacer les champs</button></div></section>

  <section id="extraOptions" style="display:none;white-space:pre-wrap;text-align:center;font-family:Arial,sans-serif;font-size:18pt;font-weight:700;color:#15345b;border:1px solid #d5dbe2;padding:2mm 3mm;overflow-wrap:anywhere"><div style="font-size:10pt;color:#d71920;margin-bottom:1mm">OPTIONS SUPPLÉMENTAIRES</div><div id="extraOptionsText"></div></section>

    <div class="spec"><div class="label">CAPACITÉ</div><div id="capacity" class="value">—</div></div>

<script>
function ficheText(value,fallback='—'){return String(value??'').trim()||fallback}
function clientLogoKey(name){return 'sbi-fiche-client-logo:'+String(name||'').trim().toLocaleUpperCase('fr')}
function setClientDisplay(name){
 const el=document.getElementById('client');if(!el)return;
 const logo=(()=>{try{return localStorage.getItem(clientLogoKey(name))||''}catch(e){return ''}})();
 el.replaceChildren();el.classList.toggle('logo-mode',!!logo);
 if(logo){const img=document.createElement('img');img.className='client-logo';img.alt=String(name||'Logo client');img.src=logo;el.appendChild(img)}
 else el.textContent=String(name||'CLIENT').toLocaleUpperCase('fr');
 updateLivePreview();
}
function saveClientLogo(){
 const input=document.getElementById('mClientLogo'),name=document.getElementById('mClient').value.trim(),file=input?.files?.[0];
 if(!file)return;
 if(!name){alert('Saisissez le nom du client avant de choisir son logo.');input.value='';return}
 if(!file.type.startsWith('image/')){alert('Choisissez un fichier image.');input.value='';return}
 if(file.size>3*1024*1024){alert('Le logo doit faire 3 Mo maximum.');input.value='';return}
 const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem(clientLogoKey(name),String(reader.result));setClientDisplay(name);if(document.getElementById('mClient').value.trim().toLocaleUpperCase('fr')===name.toLocaleUpperCase('fr'))updateLivePreview();alert('Logo enregistré pour ce client dans ce navigateur.')}catch(e){alert('Impossible d’enregistrer le logo. Essayez une image plus petite.')}};reader.readAsDataURL(file);
}
async function loadDeliveryFiche(){
 try{
  const params=new URLSearchParams(location.search), qr=params.get('qr')||'';
  if(!qr){
   document.getElementById('manualPanel').classList.add('open');
   document.getElementById('client').textContent='NOM DU CLIENT';
   document.getElementById('destination').textContent='DESTINATION';
   
   document.getElementById('capacity').textContent='—';
   document.getElementById('engine').textContent='—';
   document.getElementById('mast').textContent='—';
   fitFicheText();
   return;
  }
  if(!await session())return;
  await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:false})}catch(e){console.warn('Planification non disponible',e)}
  const c=CHARIOTS.find(x=>String(x.qr_id)===String(qr));
  if(!c){document.getElementById('sheet').innerHTML='<div class="error">Chariot introuvable. Retournez à la liste et ouvrez la fiche depuis le bon chariot.</div>';return}
  const plan=typeof getDeliveryPlan==='function'?getDeliveryPlan(c.qr_id):null;
  setClientDisplay(ficheText(c.client,'CLIENT À RENSEIGNER'));
  document.getElementById('destination').textContent=ficheText(plan?.destination||c.destination||c.delivery_destination,'DESTINATION À RENSEIGNER').toLocaleUpperCase('fr');
  document.getElementById('capacity').textContent=ficheText(fmtCapacity(c.capacity)||c.capacity);
  document.getElementById('engine').textContent=ficheText(c.engine);
  document.getElementById('mast').textContent=ficheText((c.mast_type||'')+(c.lifting_height?' '+c.lifting_height+' M':''));
  document.title='Fiche livraison — '+ficheText(c.client,'SBI');
 }catch(e){console.error(e);document.getElementById('sheet').innerHTML='<div class="error">Impossible de charger les données du chariot. Réessayez depuis le site SBI.</div>'}
}
function updateLivePreview(){const pairs=[['client','previewClient',0.42,14,34],['destination','previewDestination',0.42,14,28],['sold','previewSold',0.42,16,30]];pairs.forEach(([source,target,scale,min,max])=>{const a=document.getElementById(source),b=document.getElementById(target);if(a&&b){b.textContent=a.textContent;const size=parseFloat(a.style.fontSize)||32;b.style.fontSize=Math.max(min,Math.min(max,size*scale))+'px';}})}
function fitFicheText(){const logoSize=document.getElementById('sizeClientLogo');const logoValue=logoSize?Number(logoSize.value):90;document.documentElement.style.setProperty('--client-logo-size',logoValue+'%');const logoLabel=document.getElementById('sizeClientLogoValue');if(logoLabel)logoLabel.textContent=logoValue+' %';const settings=[['client','sizeClient',62,24,'sizeClientValue','--print-client-size'],['destination','sizeDestination',54,22,'sizeDestinationValue','--print-destination-size'],['sold','sizeStatus',60,26,'sizeStatusValue','--print-status-size']];const sizes=[];settings.forEach(([id,inputId,def,min,labelId,cssVar],i)=>{const el=document.getElementById(id),input=document.getElementById(inputId);if(!el)return;let size=input?Number(input.value):def;el.style.fontSize=size+'pt';while(el.scrollWidth>el.clientWidth+1&&size>min){size--;el.style.fontSize=size+'pt';}sizes.push({el,size,min,cssVar,labelId,input});});const sheet=document.getElementById('sheet');if(sheet){let guard=0;while(sheet.scrollHeight>sheet.clientHeight+1&&guard++<180){const candidates=sizes.filter(x=>x.size>x.min).sort((a,b)=>b.size-a.size);if(!candidates.length)break;const x=candidates[0];x.size--;x.el.style.fontSize=x.size+'pt';}}sizes.forEach(x=>{document.documentElement.style.setProperty(x.cssVar,x.size+'pt');if(x.labelId&&document.getElementById(x.labelId))document.getElementById(x.labelId).textContent=x.size+' pt';});updateLivePreview();}
function selectedOrCustom(id){const el=document.getElementById(id);if(!el)return '';if(el.value==='Autre…')return (document.getElementById(id+'Custom')?.value||'').trim();return el.value.trim();}function applyManualFiche(){const client=document.getElementById('mClient').value.trim();const destination=selectedOrCustom('mDestination');const capacity=selectedOrCustom('mCapacity');const engine=selectedOrCustom('mEngine');const mastType=selectedOrCustom('mMast');const height=document.getElementById('mHeight').value.trim();const mast=[mastType,height].filter(Boolean).join(' ');const extraOptions=document.getElementById('mOptions').value.trim();document.getElementById('extraOptionsText').textContent=extraOptions;document.getElementById('extraOptions').style.display=extraOptions?'block':'none';setClientDisplay(client||'CLIENT');document.getElementById('destination').textContent=(destination||'DESTINATION').toLocaleUpperCase('fr');document.getElementById('capacity').textContent=capacity||'—';document.getElementById('engine').textContent=engine||'—';document.getElementById('mast').textContent=mast||'—';document.title='Fiche livraison — '+(client||'SBI');fitFicheText();}
document.getElementById('manualToggle').addEventListener('click',()=>document.getElementById('manualPanel').classList.toggle('open'));document.getElementById('mClientLogo').addEventListener('change',saveClientLogo);document.getElementById('removeClientLogo').addEventListener('click',()=>{const name=document.getElementById('mClient').value.trim();if(!name){alert('Saisissez le nom du client.');return}try{localStorage.removeItem(clientLogoKey(name));setClientDisplay(name);document.getElementById('mClientLogo').value='';alert('Logo supprimé pour ce client dans ce navigateur.')}catch(e){alert('Impossible de supprimer le logo.')}});['sizeClient','sizeDestination','sizeStatus','sizeClientLogo'].forEach(id=>document.getElementById(id).addEventListener('input',fitFicheText));document.getElementById('applyManual').addEventListener('click',applyManualFiche);['mDestination','mCapacity','mMast'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',()=>{const custom=document.getElementById(id+'Custom');if(custom){custom.hidden=el.value!=='Autre…';if(!custom.hidden)custom.focus();}if(id==='mMast'){const height=document.getElementById('mHeight');if(height)height.hidden=false;}})});document.getElementById('clearManual').addEventListener('click',()=>{['mClient','mDestination','mDestinationCustom','mCapacity','mCapacityCustom','mEngine','mMast','mMastCustom','mHeight','mOptions'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';if(id.endsWith('Custom'))el.hidden=true;}});});window.addEventListener('resize',fitFicheText);window.addEventListener('beforeprint',fitFicheText);initPage(loadDeliveryFiche());
</script>
