<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){const p=window.location.pathname;if(p.endsWith('/')&&!window.location.search){window.location.replace('./index.html?root=1');}})();</script><link rel="stylesheet" href="css/style.css?v=67.51"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Connexion</title></head><body><div id="licenseGate" class="license-gate" data-first-login="true"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><div class="login-page">
  <div class="login-shell">
    <section class="login-form-side">
      <div class="login-form-inner">
        <div class="login-mobile-logo"><img src="assets/login-sbi-logo.png" alt="Logo SBI — SARL Benouatas Industrie, chariots élévateurs Hangcha"></div>
        <div class="login-heading">
          <h1>Se connecter</h1>
          <p>Connectez-vous à votre espace SBI</p>
        </div>

        <div id="loginPanel">
          <div class="login-field-modern login-field-email">
            <label for="email">Email</label>
            <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
            <input id="email" type="email" autocomplete="username" placeholder="Email">
          </div>

          <div class="login-field-modern login-field-password">
            <label for="password">Mot de passe</label>
            <svg class="login-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            <input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" onkeydown="if(event.key==='Enter'){event.preventDefault();login()}">
          </div>

          <div class="login-options-modern">
            <label class="remember-option-modern" for="rememberMe">
              <input id="rememberMe" type="checkbox">
              <span>Remember me</span>
            </label>
            <button id="forgotPasswordBtn" class="forgot-link-modern" type="button" onclick="forgotPassword()">Mot de passe oublié ?</button>
          </div>

          <button class="login-submit-modern" type="button" onclick="login()">SE CONNECTER</button>
          <div id="msg" class="error" role="status" aria-live="polite"></div>
        </div>


      </div>
    </section>

    <aside class="login-welcome-side" aria-label="SBI Hangcha — chariots élévateurs, stock, livraisons et maintenance">
      <img class="welcome-promo-image" src="assets/login-sbi-hangcha-promo.png" alt="Présentation SBI Hangcha : entrepôt industriel et chariots élévateurs, avec les services stock, livraisons et maintenance">
    </aside>
  </div>
</div><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=67.51"></script><script>setTimeout(()=>document.getElementById('licenseGate')?.classList.remove('loading-visible'),1500);initLoginControls();restoreLoginSession()</script><script src="js/button-icons.js?v=67.18"></script><script src="js/search-suggestions.js?v=67.28"></script><script src="js/mobile-fiche-popup.js?v=67.43"></script></body></html>
