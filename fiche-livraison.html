on>Tissemsilt</option><option>Tizi Ouzou</option><option>Tlemcen</option><option>Tipaza</option><option value="__custom__">Saisie manuelle…</option></select><input id="mDestinationCustom" type="text" maxlength="180" aria-label="Saisir la destination manuellement" placeholder="Saisir une ville, une adresse ou une destination" style="text-transform:uppercase" hidden></div><div><label for="mCapacity">Capacité</label><select id="mCapacity"><option value="">Choisir une capacité…</option><option>1.5T</option><option>2T</option><option>1.8T</option><option>2.5T</option><option>3T</option><option>3.5T</option><option>3.8T</option><option>5T</option><option>7T</option><option>10T</option><option>12T</option><option>Autre…</option></select><input id="mCapacityCustom" placeholder="Saisir la capacité" hidden></div><div><label for="mEngine">Type de moteur</label><select id="mEngine"><option value="">Choisir un moteur…</option><option>GERBEUR ÉLECTRIQUE</option><option>TRANSPALETTE</option><option>ÉLECTRIQUE</option><option>ISUZU</option><option>MITSUBISHI</option><option>XINCHAI</option><option>YANMAR</option><option>GPL</option></select></div><div><label for="mMast">Type de mât</label><select id="mMast"><option value="">Choisir un type de mât…</option><option>DUPLEX</option><option>TRIPLEX</option><option>Autre…</option></select><input id="mMastCustom" placeholder="Saisir le type de mât" hidden><select id="mHeight"><option value="">Hauteur de levage…</option><option>3M</option><option>4M</option><option>4.3M</option><option>4.5M</option><option>6M</option></select><div style="grid-column:1/-1"><label for="mOptions">Options supplémentaires (facultatif)</label><textarea id="mOptions" rows="2" placeholder="Ex. : déplacement latéral, fourches spéciales, cabine, pneus pleins…" style="width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;font:14px Arial;resize:vertical"></textarea></div></div><div class="size-and-actions"><div class="size-controls"><div><label for="sizeClient">Taille du nom <span id="sizeClientValue" class="size-value">62 pt</span></label><input id="sizeClient" type="range" min="24" max="100" value="62"></div><div><label for="sizeDestination">Taille de la destination <span id="sizeDestinationValue" class="size-value">54 pt</span></label><input id="sizeDestination" type="range" min="22" max="90" value="54"></div><div><label for="sizeStatus">Taille de VENDU <span id="sizeStatusValue" class="size-value">60 pt</span></label><input id="sizeStatus" type="range" min="26" max="100" value="60"></div><div><label for="sizeClientLogo">Taille du logo client <span id="sizeClientLogoValue" class="size-value">90 %</span></label><input id="sizeClientLogo" type="range" min="30" max="100" value="90"></div></div><div class="toolbar"><a href="chariots-prevus-livraison.html">← Retour</a><button type="button" onclick="window.print()">Imprimer / Enregistrer PDF</button></div></div></section></div><section class="sheet-column"><div class="sheet-heading">FICHE A4 — PAYSAGE</div><div id="sheetViewport" class="sheet-viewport">

<script>
function ficheText(value,fallback='—'){return String(value??'').trim()||fallback}
function setEngineDisplay(value){const name=String(value||'').trim();const special=['GERBEUR ÉLECTRIQUE','GERBEUR ELECTRIQUE','TRANSPALETTE'];const isSpecial=special.includes(name.toLocaleUpperCase('fr'));const label=document.getElementById('engineLabel');const engine=document.getElementById('engine');if(label){label.textContent=isSpecial?'':'MOTEUR';label.style.display=isSpecial?'none':'';}if(engine){engine.textContent=ficheText(name);engine.style.display='';}}
function clientLogoKey(name){return 'sbi-fiche-client-logo:'+String(name||'').trim().toLocaleUpperCase('fr')}
function setClientDisplay(name){
 const el=document.getElementById('client');if(!el)return;
 const logo=(()=>{try{return localStorage.getItem(clientLogoKey(name))||''}catch(e){return ''}})();
 el.replaceChildren();el.classList.toggle('logo-mode',!!logo);
 if(logo){const img=document.createElement('img');img.className='client-logo';img.alt=String(name||'Logo client');img.src=logo;el.appendChild(img)}
 else el.textContent=String(name||'CLIENT').toLocaleUpperCase('fr');

}
function saveClientLogo(){
 const input=document.getElementById('mClientLogo'),name=document.getElementById('mClient').value.trim(),file=input?.files?.[0];
 if(!file)return;
 if(!name){alert('Saisissez le nom du client avant de choisir son logo.');input.value='';return}
 if(!file.type.startsWith('image/')){alert('Choisissez un fichier image.');input.value='';return}
 if(file.size>3*1024*1024){alert('Le logo doit faire 3 Mo maximum.');input.value='';return}
 const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem(clientLogoKey(name),String(reader.result));setClientDisplay(name);alert('Logo enregistré pour ce client dans ce navigateur.')}catch(e){alert('Impossible d’enregistrer le logo. Essayez une image plus petite.')}};reader.readAsDataURL(file);
}
async function loadDeliveryFiche(){
 try{
  const params=new URLSearchParams(location.search), qr=params.get('qr')||'';
  if(!qr){
   document.getElementById('manualPanel').classList.add('open');
   document.getElementById('client').textContent='NOM DU CLIENT';
   document.getElementById('destination').textContent='DESTINATION';
   
   document.getElementById('capacity').textContent='—';
   document.getElementById('engine').textContent='—';
   document.getElementById('mast').textContent='—';
   fitFicheText();
   return;
  }
  if(!await session())return;
  await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:false})}catch(e){console.warn('Planification non disponible',e)}
  const c=CHARIOTS.find(x=>String(x.qr_id)===String(qr));
  if(!c){document.getElementById('sheet').innerHTML='<div class="error">Chariot introuvable. Retournez à la liste et ouvrez la fiche depuis le bon chariot.</div>';return}
  const plan=typeof getDeliveryPlan==='function'?getDeliveryPlan(c.qr_id):null;
  setClientDisplay(ficheText(c.client,'CLIENT À RENSEIGNER'));
  document.getElementById('destination').textContent=ficheText(plan?.destination||c.destination||c.delivery_destination,'DESTINATION À RENSEIGNER').toLocaleUpperCase('fr');
  document.getElementById('capacity').textContent=ficheText(fmtCapacity(c.capacity)||c.capacity);
  setEngineDisplay(ficheText(c.engine,''));
  document.getElementById('mast').textContent=ficheText((c.mast_type||'')+(c.lifting_height?' '+c.lifting_height+' M':''));
  document.title='Fiche livraison — '+ficheText(c.client,'SBI');
 }catch(e){console.error(e);document.getElementById('sheet').innerHTML='<div class="error">Impossible de charger les données du chariot. Réessayez depuis le site SBI.</div>'}
}
function fitSheetOnScreen(){const sheet=document.getElementById('sheet'),viewport=document.getElementById('sheetViewport');if(!sheet||!viewport||window.matchMedia('print').matches)return;const scale=viewport.clientWidth/1122;if(scale>0){sheet.style.transform='scale('+scale+')';sheet.style.transformOrigin='top left';sheet.style.width='1122px';sheet.style.height='794px';sheet.style.minHeight='794px';sheet.style.maxHeight='794px';}}
function fitFicheText(){const logoSize=document.getElementById('sizeClientLogo');const logoValue=logoSize?Number(logoSize.value):90;document.documentElement.style.setProperty('--client-logo-size',logoValue+'%');const logoLabel=document.getElementById('sizeClientLogoValue');if(logoLabel)logoLabel.textContent=logoValue+' %';const settings=[['client','sizeClient',62,24,'sizeClientValue','--print-client-size'],['destination','sizeDestination',54,22,'sizeDestinationValue','--print-destination-size'],['sold','sizeStatus',60,26,'sizeStatusValue','--print-status-size']];const sizes=[];settings.forEach(([id,inputId,def,min,labelId,cssVar],i)=>{const el=document.getElementById(id),input=document.getElementById(inputId);if(!el)return;let size=input?Number(input.value):def;el.style.fontSize=size+'pt';while(el.scrollWidth>el.clientWidth+1&&size>min){size--;el.style.fontSize=size+'pt';}sizes.push({el,size,min,cssVar,labelId,input});});const sheet=document.getElementById('sheet');if(sheet){let guard=0;while(sheet.scrollHeight>sheet.clientHeight+1&&guard++<180){const candidates=sizes.filter(x=>x.size>x.min).sort((a,b)=>b.size-a.size);if(!candidates.length)break;const x=candidates[0];x.size--;x.el.style.fontSize=x.size+'pt';}}sizes.forEach(x=>{document.documentElement.style.setProperty(x.cssVar,x.size+'pt');if(x.labelId&&document.getElementById(x.labelId))document.getElementById(x.labelId).textContent=x.size+' pt';});fitSheetOnScreen();}
function selectedOrCustom(id){const el=document.getElementById(id);if(!el)return '';if(el.value==='Autre…'||el.value==='__custom__')return (document.getElementById(id+'Custom')?.value||'').trim();return el.value.trim();}function applyManualFiche(){const client=document.getElementById('mClient').value.trim();const destination=selectedOrCustom('mDestination');const capacity=selectedOrCustom('mCapacity');const engine=selectedOrCustom('mEngine');const mastType=selectedOrCustom('mMast');const height=document.getElementById('mHeight').value.trim();const mast=[mastType,height].filter(Boolean).join(' ');const extraOptions=document.getElementById('mOptions').value.trim();document.getElementById('extraOptionsText').textContent=extraOptions;document.getElementById('extraOptions').style.display=extraOptions?'block':'none';setClientDisplay(client||'CLIENT');document.getElementById('destination').textContent=(destination||'DESTINATION').toLocaleUpperCase('fr');document.getElementById('capacity').textContent=capacity||'—';setEngineDisplay(engine);document.getElementById('mast').textContent=mast||'—';document.title='Fiche livraison — '+(client||'SBI');fitFicheText();}
document.getElementById('mClientLogo').addEventListener('change',saveClientLogo);document.getElementById('removeClientLogo').addEventListener('click',()=>{const name=document.getElementById('mClient').value.trim();if(!name){alert('Saisissez le nom du client.');return}try{localStorage.removeItem(clientLogoKey(name));setClientDisplay(name);document.getElementById('mClientLogo').value='';alert('Logo supprimé pour ce client dans ce navigateur.')}catch(e){alert('Impossible de supprimer le logo.')}});['sizeClient','sizeDestination','sizeStatus','sizeClientLogo'].forEach(id=>document.getElementById(id).addEventListener('input',fitFicheText));['mClient','mOptions','mDestinationCustom','mCapacityCustom','mMastCustom'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',applyManualFiche);});['mDestination','mCapacity','mEngine','mMast','mHeight'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('change',applyManualFiche);});['mDestination','mCapacity','mMast'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',()=>{const custom=document.getElementById(id+'Custom');if(custom){custom.hidden=!(el.value==='Autre…'||el.value==='__custom__');if(!custom.hidden)custom.focus();}if(id==='mMast'){const height=document.getElementById('mHeight');if(height)height.hidden=false;}})});window.addEventListener('resize',()=>{fitFicheText();fitSheetOnScreen()});window.addEventListener('beforeprint',()=>{const sheet=document.getElementById('sheet');if(sheet)sheet.style.transform='none';['capacity','engine','mast'].forEach(id=>{const el=document.getElementById(id);if(el)el.setAttribute('data-print-value',el.textContent.trim())});fitFicheText()});window.addEventListener('afterprint',fitSheetOnScreen);initPage(loadDeliveryFiche());
</script>
