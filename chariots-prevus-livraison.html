.pl-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pl-search{grid-column:1/-1}.pl-reset{min-height:44px}.pl-list{display:grid;gap:10px;margin-top:14px}.pl-item{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:box-shadow .15s ease,transform .15s ease}.pl-item:focus-visible{outline:3px solid rgba(20,120,230,.28);outline-offset:2px}.pl-item:hover{box-shadow:0 7px 18px rgba(15,35,55,.08);transform:translateY(-1px)}.pl-item-main{min-width:0}.pl-item-title{font-size:18px;font-weight:800;color:var(--text,#0b315d)} .pl-item-title .pl-chariot-link{display:block;width:100%;padding:3px 0}.pl-item-meta{margin-top:4px;color:var(--muted,#62748a);font-size:14px}.pl-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pl-item-actions .btn{white-space:nowrap}.pl-plan-disabled{background:#e5e7eb!important;border-color:#d1d5db!important;color:#6b7280!important;box-shadow:none!important;cursor:not-allowed!important;opacity:1!important}@media(max-width:900px){.pl-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-item{flex-direction:column;align-items:stretch}.pl-item-actions{justify-content:stretch}.pl-item-actions .btn{flex:1}}@media(max-width:560px){.pl-filter-grid{grid-template-columns:1fr}.pl-search{grid-column:auto}.pl-item-title{font-size:17px}}
.pl-view-link{cursor:pointer}.sbi-fiche-modal{position:fixed;inset:0;background:rgba(9,24,39,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}.sbi-fiche-modal.is-open{display:flex}.sbi-fiche-dialog{width:min(980px,100%);max-height:min(92vh,900px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);border:1px solid #dbe4ec}.sbi-fiche-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e5ebf0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}.sbi-fiche-head h2{margin:0;font-size:22px;color:#0f2f4d}.sbi-fiche-head .sub{margin-top:3px}.sbi-fiche-close{width:42px;height:42px;border:1px solid #d9e2e8;border-radius:11px;background:#f7fafc;color:#31485d;font-size:26px;cursor:pointer;line-height:1}.sbi-fiche-body{padding:18px}.sbi-fiche-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sbi-fiche-section{border:1px solid #e2e9ef;border-radius:14px;background:#fbfdff;padding:14px}.sbi-fiche-section h3{margin:0 0 12px;font-size:15px;color:#214866}.sbi-fiche-kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.sbi-fiche-kv{min-width:0}.sbi-fiche-label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;color:#7a8c9c;text-transform:uppercase;margin-bottom:3px}.sbi-fiche-value{display:block;font-size:15px;font-weight:700;color:#213d55;word-break:break-word}.sbi-fiche-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid #e5ebf0;background:#fff;position:sticky;bottom:0}@media(max-width:700px){.sbi-fiche-modal{padding:8px}.sbi-fiche-dialog{max-height:95vh;border-radius:15px}.sbi-fiche-grid{grid-template-columns:1fr}.sbi-fiche-kvs{grid-template-columns:1fr 1fr}.sbi-fiche-body{padding:12px}.sbi-fiche-head{padding:12px 14px}.sbi-fiche-footer{padding:12px 14px}.sbi-fiche-footer .btn{flex:1}}@media(max-width:460px){.sbi-fiche-value{font-size:14px}.sbi-fiche-label{font-size:10px}}
</style></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Chariots prévus pour livraison</h1><div class="sub">Chariots réservés, en préparation ou prêts à être livrés</div></div></div><div class="card"><div class="pl-filter-grid"><input id="plSearch" class="search pl-search" placeholder="Rechercher châssis, moteur, client..." autocomplete="off"><select id="plStatus" class="search"><option value="">Statut : Tous</option></select><select id="plEngine" class="search"><option value="">Moteur : Tous</option></select><select id="plCapacity" class="search"><option value="">Capacité : Toutes</option></select><select id="plMast" class="search"><option value="">Mât : Tous</option></select><select id="plHeight" class="search"><option value="">Hauteur : Toutes</option></select><button id="plReset" class="btn light pl-reset" type="button">Réinitialiser</button></div><div id="plCount" class="sub" style="margin-top:10px"></div></div><div id="plList" class="pl-list"></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><div id="sbiFicheModal" class="sbi-fiche-modal" aria-hidden="true"><div class="sbi-fiche-dialog" role="dialog" aria-modal="true" aria-labelledby="sbiFicheTitle"><div class="sbi-fiche-head"><div><h2 id="sbiFicheTitle">Fiche chariot</h2><div id="sbiFicheStatus" class="sub"></div></div><button type="button" class="sbi-fiche-close" id="sbiFicheClose" aria-label="Fermer">×</button></div><div id="sbiFicheBody" class="sbi-fiche-body"></div><div class="sbi-fiche-footer"><button type="button" class="btn light" id="sbiFicheCloseBottom">Fermer</button><button type="button" class="btn" id="sbiFicheOpenFull">Ouvrir la fiche complète</button></div></div></div><footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js?v=67.18"></script><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=67.36"></script><script>
async function plannedDeliveryPage(){
  if(!await session())return; await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:true})}catch(e){DELIVERY_PLANS=readCachedDeliveryPlans(); console.warn('Chargement des planifications depuis le serveur impossible',e)}
  const els={search:document.getElementById('plSearch'),status:document.getElementById('plStatus'),engine:document.getElementById('plEngine'),capacity:document.getElementById('plCapacity'),mast:document.getElementById('plMast'),height:document.getElementById('plHeight'),reset:document.getElementById('plReset'),count:document.getElementById('plCount'),list:document.getElementById('plList')};
  const ficheModal=document.getElementById('sbiFicheModal'),ficheBody=document.getElementById('sbiFicheBody'),ficheTitle=document.getElementById('sbiFicheTitle'),ficheStatus=document.getElementById('sbiFicheStatus'),ficheOpenFull=document.getElementById('sbiFicheOpenFull');
  let ficheCurrentId='';
  const ficheVal=v=>{const x=String(v??'').trim();return esc(x||'—')};
  function openFicheModal(id){
    const c=CHARIOTS.find(x=>String(x.qr_id)===String(id)); if(!c)return;
    ficheCurrentId=c.qr_id||id; const p=getDeliveryPlan(ficheCurrentId)||{};
    const plannedDate=p.date?formatPlannedDate(p.date):'—', plannedTime=p.time||'—', plannedDriver=p.driver||'—', plannedDestination=p.destination||'—';
    ficheTitle.textContent=c.chassis||c.qr_id||'Fiche chariot';
    ficheStatus.textContent=(c.status||'—')+(c.client?' · Client : '+c.client:'');
    const section=(title,items)=>`<section class="sbi-fiche-section"><h3>${esc(title)}</h3><div class="sbi-fiche-kvs">${items.map(([l,v])=>`<div class="sbi-fiche-kv"><span class="sbi-fiche-label">${esc(l)}</span><strong class="sbi-fiche-value">${v}</strong></div>`).join('')}</div></section>`;
    ficheBody.innerHTML=`<div class="sbi-fiche-grid">${section('Identification',[['N° châssis',ficheVal(c.chassis)],['N° de série',ficheVal(c.serial_number)],['N° moteur',ficheVal(c.engine_number)],['Moteur',ficheVal(c.engine)],['Client',ficheVal(c.client)]])}${section('Caractéristiques',[['Capacité',ficheVal(fmtCapacity(c.capacity))],['Hauteur de levage',ficheVal(c.lifting_height)],['Type de mât',ficheVal(String(c.mast_type||'').toUpperCase())],['Dimensions des fourches',ficheVal(c.fork_dimension)],['Type de pneu',ficheVal(c.tire_type)],['Couleur',ficheVal(c.color)],['Statut',ficheVal(c.status)]])}${section('Informations stock',[['Emplacement',ficheVal(c.stock)],['QR ID',ficheVal(c.qr_id)],['Date d’ajout',ficheVal(c.created_at?String(c.created_at).slice(0,10):'')]])}${section('Planning / livraison',[['Date prévue',ficheVal(plannedDate)],['Heure prévue',ficheVal(plannedTime)],['Chauffeur',ficheVal(plannedDriver)],['Destination',ficheVal(plannedDestination)],['Date de livraison effective',ficheVal(c.delivery_date)]])}</div><section class="sbi-fiche-section" style="margin-top:14px"><h3>Observations</h3><div class="sbi-fiche-value" style="font-weight:600;white-space:pre-wrap">${ficheVal(c.observations||'Aucune observation enregistrée.')}</div></section>`;
    ficheModal.classList.add('is-open'); ficheModal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  }
  function closeFicheModal(){ficheModal.classList.remove('is-open');ficheModal.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  document.getElementById('sbiFicheClose').onclick=closeFicheModal; document.getElementById('sbiFicheCloseBottom').onclick=closeFicheModal;
  ficheModal.addEventListener('click',e=>{if(e.target===ficheModal)closeFicheModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ficheModal.classList.contains('is-open'))closeFicheModal()});
  ficheOpenFull.onclick=()=>{if(ficheCurrentId)location.href='chariot.html?id='+encodeURIComponent(ficheCurrentId)+'&from=prevus'};
  let baseRows=CHARIOTS.filter(isPlanned);
  function latestFirst(rows){return [...rows].sort((a,b)=>{const da=new Date(a.created_at||a.updated_at||0).getTime(),db=new Date(b.created_at||b.updated_at||0).getTime();if(db!==da)return db-da;return(Number(b.id)||0)-(Number(a.id)||0)})}
  function values(key,label){const vals=[...new Set(baseRows.map(c=>String(c[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return '<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
  function buildFilters(){els.status.innerHTML='<option value="">Statut : Tous</option>'+[...new Set(baseRows.map(c=>String(c.status||'').trim()).filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');els.engine.innerHTML=values('engine','Moteur : Tous');els.capacity.innerHTML=values('capacity','Capacité : Toutes');els.mast.innerHTML=values('mast_type','Mât : Tous');els.height.innerHTML=values('lifting_height','Hauteur : Toutes')}
  function match(c){const q=els.search.value.trim().toLowerCase();const text=[c.qr_id,c.chassis,c.engine,c.engine_number,c.client].map(v=>String(v||'').toLowerCase());return(!q||text.some(v=>v.includes(q)))&&(!els.status.value||String(c.status||'')===els.status.value)&&(!els.engine.value||String(c.engine||'')===els.engine.value)&&(!els.capacity.value||String(c.capacity||'')===els.capacity.value)&&(!els.mast.value||String(c.mast_type||'')===els.mast.value)&&(!els.height.value||String(c.lifting_height||'')===els.height.value)}
  function render(){const rows=latestFirst(baseRows.filter(match));els.count.textContent=rows.length+' chariot'+(rows.length!==1?'s':'')+' prévu'+(rows.length!==1?'s':'')+' pour livraison';els.list.innerHTML=rows.map(c=>{const alreadyPlanned=!!getDeliveryPlan(c.qr_id);return `<div class="card pl-item" role="link" tabindex="0" aria-label="Ouvrir la fiche du chariot ${esc(c.chassis||c.qr_id||'')}" data-chariot-row="${esc(c.qr_id||'')}"><div class="pl-item-main"><div class="pl-item-title">${esc(c.chassis||c.qr_id||'—')}</div><div class="pl-item-meta">${esc(c.engine||'—')} · ${esc(fmtCapacity(c.capacity)||'—')} · ${esc(c.client||'—')}</div><div class="pl-item-meta">Statut : <strong>${esc(c.status||'—')}</strong>${c.delivery_date?' · Livraison : '+esc(c.delivery_date):''}</div></div><div class="pl-item-actions"><button class="btn light pl-view-link" type="button" data-view-fiche="${esc(c.qr_id||'')}">Voir la fiche</button>${isAdmin()?(alreadyPlanned?`<button class="btn pl-plan-disabled" type="button" disabled aria-disabled="true" title="Ce chariot est déjà planifié.">Planifié</button>`:`<button class="btn" type="button" data-plan="${esc(c.qr_id)}">Planifier</button>`):''}${isAdmin()?(()=>{const st=normalizeStatus(c.status);if(st==='reserve')return `<button class="btn" type="button" data-workflow="start-modification" data-qr="${esc(c.qr_id)}">Modification production</button>`;if(st==='modification production')return `<button class="btn" type="button" data-workflow="finish-modification" data-qr="${esc(c.qr_id)}">Modification terminée</button>`;if(st==='preparation livraison')return `<button class="btn" type="button" data-workflow="ready" data-qr="${esc(c.qr_id)}">Prêt à livrer</button>`;if(st==='pret a livrer')return `<button class="btn delivered-action" type="button" data-workflow="deliver" data-qr="${esc(c.qr_id)}">Livrer</button>`;return ''})():''}</div></div>`}).join('')||'<div class="empty">Aucun chariot prévu pour livraison.</div>';els.list.querySelectorAll('[data-plan]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!requireAdmin())return;location.href='planning-livraisons.html?qr='+encodeURIComponent(b.dataset.plan)});els.list.querySelectorAll('[data-workflow]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!requireAdmin())return;if(b.dataset.busy==='1')return;b.dataset.busy='1';b.disabled=true;try{const ok=await performWorkflowAction(b.dataset.qr,b.dataset.workflow);if(ok){await loadChariots();await loadDeliveryPlans({migrateLocal:false}).catch(()=>{});baseRows=CHARIOTS.filter(isPlanned);buildFilters();render();toastCardUpdate(b.dataset.qr,b.dataset.workflow==='start-modification'?'Modification production':b.dataset.workflow==='finish-modification'?'Préparation livraison':b.dataset.workflow==='prepare'?'Préparation livraison':b.dataset.workflow==='ready'?'Prêt à livrer':'Livré')}}finally{b.dataset.busy='0';b.disabled=false}});els.list.querySelectorAll('[data-chariot-row]').forEach(row=>{const go=()=>{const id=row.dataset.chariotRow;if(id)location.href='chariot.html?id='+encodeURIComponent(id)+'&from=prevus'};row.addEventListener('click',e=>{if(e.target.closest('a,button,input,select,textarea'))return;go()});row.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('a,button,input,select,textarea')){e.preventDefault();go()}})});bindFicheButtons()}
  function bindFicheButtons(){els.list.querySelectorAll('[data-view-fiche]').forEach(b=>b.onclick=e=>{e.stopPropagation();openFicheModal(b.dataset.viewFiche)});}
  function isPlanned(c){const s=normalizeStatus(c.status);return s==='prevu pour livraison'||s==='reserve'||s==='modification production'||s==='preparation livraison'||s==='pret a livrer'}
  buildFilters();[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.addEventListener(el===els.search?'input':'change',render));els.reset.onclick=()=>{[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.value='');render()};render();
  const refreshLive=async()=>{try{await loadChariots();await loadDeliveryPlans();baseRows=CHARIOTS.filter(isPlanned);buildFilters();render()}catch(e){console.warn('Actualisation temps réel livraisons prévues',e)}};
  startSbiRealtime(()=>{if(document.visibilityState==='visible')refreshLive()},['chariots','maintenance']);
  window.addEventListener('pageshow',async()=>{await refreshLive()});
}
initPage(plannedDeliveryPage())
</script><script src="js/button-icons.js?v=67.18"></script><script src="js/search-suggestions.js?v=67.28"></script></body></html>
