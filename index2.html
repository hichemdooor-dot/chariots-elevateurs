<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chariots élévateurs — Fiches QR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#11151b;border:1px solid #252b34;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:30px;margin:0 0 6px}
h2{font-size:22px;margin:26px 0 12px}
.sub{color:#9ca7b7;margin-bottom:18px}
.badge{display:inline-block;background:#1a2029;padding:8px 14px;border-radius:999px;font-weight:700;margin:8px 0 18px}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #303744;background:#0c1015;color:#fff;font-size:16px}
.results{margin-top:10px}
.result{padding:12px 14px;border:1px solid #252b34;border-radius:14px;margin:8px 0;background:#0f1318;cursor:pointer}
.result small{color:#9ca7b7}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.item{background:#0c1015;border-radius:16px;padding:14px 16px;border:1px solid #1e242c}
.label{display:block;color:#8f9aaa;font-size:14px;margin-bottom:4px}
.value{font-size:18px;font-weight:650;word-break:break-word}
.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#202631;font-size:14px;font-weight:700}
footer{margin-top:20px;color:#7f8998;font-size:12px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1>Chariot élévateur</h1>
  <div class="sub">Fiche technique • système QR</div>
  <input id="search" class="search" placeholder="Rechercher QR ID, châssis, client..." autocomplete="off">
  <div id="results" class="results"></div>

  <div id="fiche" class="hidden">
    <div id="qrid" class="badge"></div>
    <div id="status"></div>

    <h2>Identification</h2>
    <div class="grid" id="identification"></div>

    <h2>Caractéristiques</h2>
    <div class="grid" id="characteristics"></div>

    <h2>Informations</h2>
    <div class="grid" id="information"></div>

    <footer>Fiche générée à partir du fichier de gestion des chariots.</footer>
  </div>
</div>
</div>

const fields = {
  identification: [
    ["N° châssis","N° châssis"],
    ["N° de série","N° de serie"],
    ["N° moteur","Engine Number"],
    ["Moteur","Moteur"]
  ],
  characteristics: [
    ["Capacité","Capacité (T)"],
    ["Hauteur de levage","Hauteur de levage (m)"],
    ["Dimensions des fourches","Dimention de fourche (M)"],
    ["Type de mât","Type de mât"],
    ["Type de pneu","TYPE DE PNEU"],
    ["Couleur","Couleur"]
  ],
  information: [
    ["Stock","STOCK"],
    ["Statut","Statut"],
    ["Client","Client"],
    ["Date de livraison","Date livraison"],
    ["Observations","Observations"]
  ]
};

const esc = s => String(s ?? "—").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const params = new URLSearchParams(location.search);
const requested = params.get("id") || params.get("qr");

function findChariot(q) {
  if (!q) return null;
  const x = q.trim().toLowerCase();
  return CHARIOTS.find(c =>
    String(c["QR ID"]).toLowerCase() === x ||
    String(c["N° châssis"] || "").toLowerCase() === x
  ) || null;
}

function item(label, value) {
  return `<div class="item"><span class="label">${esc(label)}</span><span class="value">${esc(value || "—")}</span></div>`;
}

function show(c) {
  if (!c) return;
  document.getElementById("fiche").classList.remove("hidden");
  document.getElementById("search").value = c["QR ID"] || "";
  document.getElementById("qrid").textContent = c["QR ID"] || "—";
  document.getElementById("status").innerHTML = `<span class="status">${esc(c["Statut"] || "Statut non renseigné")}</span>`;
  for (const section of Object.keys(fields)) {
    document.getElementById(section).innerHTML =
      fields[section].map(([label,key]) => item(label,c[key])).join("");
  }
  history.replaceState(null,"","?id="+encodeURIComponent(c["QR ID"]));
}

function search(q) {
  const box = document.getElementById("results");
  const x = q.trim().toLowerCase();
  if (!x) { box.innerHTML = ""; return; }
  const found = CHARIOTS.filter(c => JSON.stringify(c).toLowerCase().includes(x)).slice(0,12);
  box.innerHTML = found.map(c => `
    <div class="result" data-id="${esc(c["QR ID"])}">
      <strong>${esc(c["QR ID"])} — ${esc(c["N° châssis"])}</strong><br>
      <small>${esc(c["Moteur"])} • ${esc(c["Capacité (T)"])} • ${esc(c["Statut"])}</small>
    </div>`).join("");
  box.querySelectorAll(".result").forEach(el => el.onclick = () => show(findChariot(el.dataset.id)));
}

document.getElementById("search").addEventListener("input", e => search(e.target.value));

const initial = findChariot(requested) || CHARIOTS[0];
show(initial);
</script>
